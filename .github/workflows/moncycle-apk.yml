name: Build Mon Cycle Modern APK

on:
  workflow_dispatch:
  push:
    branches: [ mon-cycle-modern ]
    paths:
      - 'MonCycleApp/**'
      - 'tools/**'
      - '.github/workflows/moncycle-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply marker color customization
        run: python3 tools/apply_marker_color_patch.py

      - name: Persist integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MonCycleApp/app/src/main/java/fr/moncycle/app/MainActivity.kt
          git commit -m "Integrate customizable marker colors [skip ci]" || true
          git push origin HEAD:mon-cycle-modern

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build modern debug APK
        working-directory: MonCycleApp
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Verify APK
        run: test -f MonCycleApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish modern APK on branch
        run: |
          mkdir -p apk
          cp MonCycleApp/app/build/outputs/apk/debug/app-debug.apk apk/MonCycle-modern.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/MonCycle-modern.apk
          git commit -m "Publish Mon Cycle modern APK" || true
          git push origin HEAD:mon-cycle-modern

      - name: Upload modern APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Cycle-Modern-APK
          path: MonCycleApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

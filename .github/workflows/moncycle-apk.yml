name: Build Mon Cycle APK

on:
  workflow_dispatch:
  push:
    branches: [ mon-cycle-build ]
    paths:
      - 'MonCycleApp/**'
      - '.github/workflows/moncycle-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MonCycleApp
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: test -f MonCycleApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Cycle-APK
          path: MonCycleApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

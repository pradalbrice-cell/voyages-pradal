name: Build and verify Mon Cycle V3.6

on:
  workflow_dispatch:
  push:
    branches: [ mon-cycle-modern ]
    paths:
      - 'MonCycleApp/**'
      - 'tools/**'
      - '.github/workflows/moncycle-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify selected logo source
        run: |
          LOGO="MonCycleApp/app/src/main/res/drawable/mon_cycle_selected.png"
          test -s "$LOGO"
          file "$LOGO" | grep -q "PNG image data"
          python3 - <<'PY'
          import struct
          p='MonCycleApp/app/src/main/res/drawable/mon_cycle_selected.png'
          with open(p,'rb') as f:
              sig=f.read(8)
              assert sig==b'\x89PNG\r\n\x1a\n', sig
              length=struct.unpack('>I',f.read(4))[0]
              chunk=f.read(4)
              assert chunk==b'IHDR', chunk
              w,h=struct.unpack('>II',f.read(8))
          assert w==h, (w,h)
          assert w>=128, (w,h)
          print('Logo OK:', w, h)
          PY

      - name: Apply Mon Cycle patches
        run: |
          python3 tools/apply_marker_color_patch.py
          python3 tools/apply_first_click_setup.py
          python3 tools/apply_logo_layout.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MonCycleApp
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Verify APK structure and launcher resources
        run: |
          APK="MonCycleApp/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='fr.moncycle.app'" /tmp/badging.txt
          grep -q "versionName='3.6'" /tmp/badging.txt
          grep -q "application-label:'Mon Cycle'" /tmp/badging.txt
          grep -q "launchable-activity: name='fr.moncycle.app.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" > /tmp/resources.txt
          grep -q "mipmap/ic_launcher" /tmp/resources.txt
          grep -q "mipmap/ic_launcher_round" /tmp/resources.txt
          unzip -l "$APK" | grep -q "res/drawable/mon_cycle_selected.png"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test onboarding logo and navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash tools/smoke_test_moncycle.sh
            adb shell uiautomator dump /sdcard/final_home.xml >/dev/null
            adb pull /sdcard/final_home.xml /tmp/final_home.xml >/dev/null
            grep -q 'content-desc="Logo Mon Cycle"' /tmp/final_home.xml
            mkdir -p verification
            adb exec-out screencap -p > verification/final-home.png

      - name: Publish verified APK on branch
        run: |
          mkdir -p apk
          cp MonCycleApp/app/build/outputs/apk/debug/app-debug.apk apk/MonCycle-V3.6.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/MonCycle-V3.6.apk
          git commit -m "Publish verified Mon Cycle V3.6 APK [skip ci]" || true
          git push origin HEAD:mon-cycle-modern

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Cycle-V3.6-APK
          path: MonCycleApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Cycle-V3.6-Screenshot
          path: verification/final-home.png
          if-no-files-found: error

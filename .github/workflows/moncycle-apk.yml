name: Build Mon Cycle APK

on:
  workflow_dispatch:
  push:
    branches: [ mon-cycle-build ]
    paths:
      - 'MonCycleApp/**'
      - '.github/workflows/moncycle-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix navigation calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MonCycleApp/app/src/main/java/fr/moncycle/app/MainActivity.kt')
          s=p.read_text()
          s=s.replace('NavigationBarItem(tab==0,{tab=0},{Icon(Icons.Default.Home,null)},{Text("Aujourd’hui")})','NavigationBarItem(selected=tab==0,onClick={tab=0},icon={Icon(Icons.Default.Home,null)},label={Text("Aujourd’hui")})')
          s=s.replace('NavigationBarItem(tab==1,{tab=1},{Icon(Icons.Default.CalendarMonth,null)},{Text("Calendrier")})','NavigationBarItem(selected=tab==1,onClick={tab=1},icon={Icon(Icons.Default.CalendarMonth,null)},label={Text("Calendrier")})')
          s=s.replace('NavigationBarItem(tab==2,{tab=2},{Icon(Icons.Default.Settings,null)},{Text("Réglages")})','NavigationBarItem(selected=tab==2,onClick={tab=2},icon={Icon(Icons.Default.Settings,null)},label={Text("Réglages")})')
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MonCycleApp
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Verify APK
        run: test -f MonCycleApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK on branch
        run: |
          mkdir -p apk
          cp MonCycleApp/app/build/outputs/apk/debug/app-debug.apk apk/MonCycle.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/MonCycle.apk
          git commit -m "Publish Mon Cycle APK" || true
          git push origin HEAD:mon-cycle-build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Cycle-APK
          path: MonCycleApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

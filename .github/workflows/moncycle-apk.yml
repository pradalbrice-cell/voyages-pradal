name: Build and verify Mon Cycle V3.2

on:
  workflow_dispatch:
  push:
    branches: [ mon-cycle-modern ]
    paths:
      - 'MonCycleApp/**'
      - 'tools/**'
      - '.github/workflows/moncycle-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply build fixes and marker colors
        run: python3 tools/apply_marker_color_patch.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: MonCycleApp
        run: gradle assembleDebug --stacktrace --console=plain
      - name: Verify APK structure and launcher icon
        run: |
          APK="MonCycleApp/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='fr.moncycle.app'" /tmp/badging.txt
          grep -q "application-label:'Mon Cycle'" /tmp/badging.txt
          grep -q "launchable-activity: name='fr.moncycle.app.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" > /tmp/resources.txt
          grep -q "drawable/ic_mon_cycle_launcher" /tmp/resources.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r MonCycleApp/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop fr.moncycle.app
            adb shell am start -W -n fr.moncycle.app/.MainActivity
            sleep 4
            PID=$(adb shell pidof fr.moncycle.app || true)
            test -n "$PID"
            ! adb logcat -d -v time AndroidRuntime:E '*:S' | grep -q "Process: fr.moncycle.app"
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window.xml
            grep -q "Mon Cycle" /tmp/window.xml
            grep -q "Accueil" /tmp/window.xml
            grep -q "Calendrier" /tmp/window.xml
            grep -q "Réglages" /tmp/window.xml
      - name: Publish verified APK on branch
        run: |
          mkdir -p apk
          cp MonCycleApp/app/build/outputs/apk/debug/app-debug.apk apk/MonCycle-V3.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/MonCycle-V3.2.apk
          git commit -m "Publish verified Mon Cycle V3.2 APK [skip ci]" || true
          git push origin HEAD:mon-cycle-modern
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Cycle-V3.2-APK
          path: MonCycleApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

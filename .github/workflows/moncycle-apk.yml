name: Build Mon Cycle APK

on:
  workflow_dispatch:
  push:
    branches: [ mon-cycle-build ]
    paths:
      - 'moncycle-build/**'
      - '.github/workflows/moncycle-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project archive
        run: |
          cat moncycle-build/part1.b64 moncycle-build/part2.b64 moncycle-build/part3.b64 moncycle-build/part4.b64 moncycle-build/part5.b64 | base64 -d > moncycle.zip
          unzip -q moncycle.zip
          test -f MonCycle/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        working-directory: MonCycle
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: MonCycle
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: test -f MonCycle/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Cycle-APK
          path: MonCycle/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
